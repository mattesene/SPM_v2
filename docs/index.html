<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPM_v2 — Dashboard</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#101827;--line:#263246;--text:#edf2f7;--muted:#94a3b8;--accent:#69d3a7;--gold:#f2c14e}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#080d18,#0d1524);font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--text)}
main{max-width:1100px;margin:auto;padding:24px 16px 48px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}h1{font-size:28px;margin:0}p{margin:5px 0;color:var(--muted)}.badge{border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:12px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.card,.match{background:rgba(16,24,39,.92);border:1px solid var(--line);border-radius:14px}.card{padding:16px}.label{font-size:12px;color:var(--muted)}.value{font-size:25px;font-weight:750;margin-top:7px}
section{margin-top:18px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}h2{font-size:18px;margin:0}.matches{display:grid;gap:10px}.match{padding:15px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.teams{font-weight:700}.meta{font-size:12px;color:var(--muted);margin-top:5px}.signal{font-weight:750;color:var(--accent);text-align:right}.prob{font-size:22px}.empty{text-align:center;padding:28px;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
footer{margin-top:28px;color:var(--muted);font-size:12px;text-align:center}@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}.match{grid-template-columns:1fr}.signal{text-align:left}}@media(max-width:430px){main{padding:18px 12px}.grid{gap:8px}.card{padding:12px}.value{font-size:21px}}
</style>
</head>
<body>
<main>
<header><div><h1>SPM_v2</h1><p>Statistical Draw Probability Monitor</p></div><div class="badge">LIVE DASHBOARD</div></header>
<div class="grid">
<div class="card"><div class="label">Selezioni</div><div class="value">—</div></div>
<div class="card"><div class="label">Probabilità X</div><div class="value">—</div></div>
<div class="card"><div class="label">SPM Score</div><div class="value">—</div></div>
<div class="card"><div class="label">Aggiornamento</div><div class="value">—</div></div>
</div>
<section><div class="section-title"><h2>Top opportunità</h2></div><div class="empty">In attesa del primo aggiornamento Live.</div></section>
<footer>Dashboard generata automaticamente da SPM_v2 · i dati vengono aggiornati dal workflow Live.</footer>
</main>
</body>
</html>
