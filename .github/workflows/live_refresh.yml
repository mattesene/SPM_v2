name: live-refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Refresh Live report
        env:
          SPM_DB: ${{ secrets.SPM_DB_PATH }}
          SPM_OOS: ${{ secrets.SPM_OOS_PATH }}
        run: |
          test -n "$SPM_DB"
          test -n "$SPM_OOS"
          python -m spm.cli --db "$SPM_DB" --live --oos "$SPM_OOS" --html live.html
      - uses: actions/upload-artifact@v4
        with:
          name: spm-live-dashboard
          path: live.html
