name: live-refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - name: Bootstrap Live database and fixtures
        env:
          SPM_LIVE_PROVIDER: sofascore
          SPM_LIVE_DAYS: "7"
        run: python scripts/prepare_live_database.py --db data/live/spm.db --cache data/cache/historical
      - name: Build Live dashboard
        run: python -m spm.cli --db data/live/spm.db --live --html docs/index.html
      - name: Publish dashboard to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "chore: refresh live dashboard"
          git push
      # Push to main intentionally triggers the next refresh cycle only when docs/index.html changes.
