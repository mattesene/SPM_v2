name: live-refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/index.html"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - name: Bootstrap Live database and fixtures
        env:
          SPM_LIVE_PROVIDER: sofascore
          SPM_LIVE_DAYS: "7"
        run: python scripts/prepare_live_database.py --db data/live/spm.db --cache data/cache/historical
      - name: Locate OOS ranking
        id: oos
        shell: bash
        run: |
          set -euo pipefail
          candidate=""
          for path in data/live/oos_ranking.csv data/oos_ranking.csv data/rankings/oos_ranking.csv; do
            if [ -s "$path" ]; then
              candidate="$path"
              break
            fi
          done
          if [ -n "$candidate" ]; then
            echo "path=$candidate" >> "$GITHUB_OUTPUT"
            echo "OOS ranking found: $candidate"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "No OOS ranking file found; continuing in SPM-only mode."
          fi
      - name: Build Live dashboard
        shell: bash
        env:
          OOS_PATH: ${{ steps.oos.outputs.path }}
        run: |
          set -euo pipefail
          if [ -n "$OOS_PATH" ]; then
            python -m spm.cli --db data/live/spm.db --live --oos "$OOS_PATH" --html docs/index.html
          else
            python -m spm.cli --db data/live/spm.db --live --html docs/index.html
          fi
      - name: Publish dashboard to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "chore: refresh live dashboard"
          git push
      # docs/index.html is ignored by the push trigger above, preventing a refresh loop.
