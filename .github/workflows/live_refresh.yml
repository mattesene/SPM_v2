name: live-refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Validate Live inputs
        run: |
          test -f data/live/spm.db
          test -f data/live/oos.csv
      - name: Refresh Live report
        run: python -m spm.cli --db data/live/spm.db --live --oos data/live/oos.csv --html live.html
      - uses: actions/upload-artifact@v4
        with:
          name: spm-live-dashboard
          path: live.html
