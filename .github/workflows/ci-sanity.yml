name: ci-sanity

on:
  push:
    branches: ["feat/odds-ingestion"]
  workflow_dispatch:

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - run: pytest -q tests/test_report.py tests/test_odds_staking.py tests/test_historical_backtest_gate.py
