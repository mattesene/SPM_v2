name: team-progression-backtest

on:
  workflow_dispatch:
  push:
    paths:
      - "src/spm/backtest/team_progression.py"
      - "src/spm/backtest/calibration.py"
      - "src/spm/statistics/engine.py"
      - "src/spm/statistics/features.py"
      - "scripts/run_team_progression_backtest.py"
      - ".github/workflows/team-progression-backtest.yml"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - name: Run regression tests
        run: pytest -q
      - name: Run full team progression backtest
        run: python scripts/run_team_progression_backtest.py --min-history 5 --top-n 5
      - name: Validate report
        run: |
          test -s reports/team_progression_backtest.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("reports/team_progression_backtest.json").read_text())
          aggregate = report["aggregate"]
          calibration = report["calibration"]
          assert aggregate["dataset_count"] == 35
          assert aggregate["bets"] > 0
          assert calibration["streak_buckets"]
          assert calibration["probability_buckets"]
          print(json.dumps(aggregate, indent=2))
          print(json.dumps(calibration, indent=2))
          PY
      - name: Upload team progression report
        uses: actions/upload-artifact@v4
        with:
          name: team-progression-backtest
          path: reports/team_progression_backtest.json
          if-no-files-found: error
