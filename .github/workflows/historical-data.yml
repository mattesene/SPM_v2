name: historical-data

on:
  push:
    branches:
      - feat/odds-ingestion
  workflow_dispatch:

jobs:
  historical-data-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - name: Download and validate 35 historical datasets
        run: python scripts/validate_historical_data.py
      - name: Upload historical validation report
        uses: actions/upload-artifact@v4
        with:
          name: historical-data-validation
          path: reports/historical_data_validation.json
          if-no-files-found: error
