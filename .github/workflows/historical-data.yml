name: historical-data

on:
  push:
    branches:
      - feat/odds-ingestion
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-data-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - name: Validate historical dataset scope
        run: python scripts/validate_historical_data.py
      - name: Upload historical validation report
        uses: actions/upload-artifact@v4
        with:
          name: historical-data-validation
          path: reports/historical_data_validation.json
          if-no-files-found: error
