name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - run: pytest -q

  historical-data-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - name: Download and validate 35 historical datasets
        run: python scripts/validate_historical_data.py
      - name: Upload historical validation report
        uses: actions/upload-artifact@v4
        with:
          name: historical-data-validation
          path: reports/historical_data_validation.json
          if-no-files-found: error

  historical-backtest:
    needs: historical-data-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - name: Download 35 historical datasets
        run: python scripts/validate_historical_data.py
      - name: Run historical model backtest
        run: python scripts/run_historical_backtest.py .historical-cache --output reports/historical_backtest.json
      - name: Upload historical backtest report
        uses: actions/upload-artifact@v4
        with:
          name: historical-backtest-report
          path: reports/historical_backtest.json
          if-no-files-found: error

  historical-market-backtest:
    needs: historical-data-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - name: Download 35 historical datasets and market prices
        run: python scripts/validate_historical_data.py
      - name: Run odds-aware SPM strategy backtest
        run: python scripts/run_historical_market_backtest.py .historical-cache --output reports/historical_market_backtest.json
      - name: Upload odds-aware strategy report
        uses: actions/upload-artifact@v4
        with:
          name: historical-market-backtest-report
          path: reports/historical_market_backtest.json
          if-no-files-found: error

# Historical data, model backtesting and the odds-aware strategy are validated in CI.
