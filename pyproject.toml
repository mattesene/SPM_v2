[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spm-v2"
version = "0.1.0"
description = "Statistical Pareggio Model"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
